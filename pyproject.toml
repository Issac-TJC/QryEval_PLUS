[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qryeval-plus"
version = "0.3.0"
description = "Configurable information retrieval, reranking, and RAG experiments"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.23,<2",
  "torch>=2.0,<2.1",
  "transformers>=4.40,<4.41",
  "huggingface-hub>=0.20,<1",
  "pyjnius>=1.5",
  "faiss-cpu>=1.8,<1.9",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "build>=1.0"]
agent = [
  "pydantic>=2.8,<3; python_version >= '3.11'",
  "langgraph>=1.0,<2; python_version >= '3.11'",
]

[project.scripts]
qryeval = "qryeval_plus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qryeval_plus = ["vendor/java/*.jar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: uses local indexes and neural model checkpoints"]
